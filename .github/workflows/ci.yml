name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing release tag to verify; leave empty for normal CI
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.20.x', stable]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - run: go test -race -timeout 2m ./...
      - run: go vet ./...

  release-please:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-please-main
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  verify-module:
    needs: [test, release-please]
    # GITHUB_TOKEN-created releases do not trigger another workflow. Verify
    # within this run, with workflow_dispatch available to retry an existing tag.
    if: >-
      always() && !cancelled() &&
      needs.test.result == 'success' &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: verify-module-${{ needs.release-please.outputs.tag_name || inputs.release_tag }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.release_tag }}
    steps:
      - name: Validate existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --json tagName --jq .tagName

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Verify Go module availability
        env:
          GOPROXY: https://proxy.golang.org
        run: |
          module_name=$(go list -m)
          # Download outside the module so this checks the published tag.
          cd "$(mktemp -d)"
          for attempt in {1..10}; do
            if go mod download -json "${module_name}@${RELEASE_TAG}"; then
              echo "${module_name}@${RELEASE_TAG} is available from the Go proxy."
              exit 0
            fi
            if (( attempt < 10 )); then
              sleep 15
            fi
          done
          echo "::error::Go proxy could not fetch ${module_name}@${RELEASE_TAG}"
          exit 1

  docs-build:
    name: Build documentation
    if: github.event_name != 'pull_request' && inputs.release_tag == ''
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    env:
      MKDOCS_GIT_COMMITTERS_APIKEY: ${{ secrets.MKDOCS_GIT_COMMITTERS_APIKEY }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3"
          cache: pipenv
      - name: Install pipenv
        run: python3 -m pip install --upgrade pip pipenv
      - name: Install Dependencies
        run: pipenv sync
      - name: Restore Build Cache
        uses: actions/cache/restore@v4
        with:
          key: mkdocs-material-${{ hashfiles('.cache/**') }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - name: Build Documentation
        run: pipenv run mkdocs build
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site
      - name: Save Build Cache
        uses: actions/cache/save@v4
        with:
          key: mkdocs-material-${{ hashfiles('.cache/**') }}
          path: .cache

  docs-deploy:
    name: Deploy documentation
    needs: docs-build
    concurrency:
      group: github-pages
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
